name: publish

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  require-ci:
    name: require successful CI on this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read # query CI workflow runs for this release commit
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: api.github.com:443
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
        # Main's CI concurrency can cancel this run. A cancellation fails publishing;
        # the owner must re-run CI before re-running the publish workflow.
        run: |
          deadline=$((SECONDS + 3540))
          while (( SECONDS < deadline )); do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$COMMIT&per_page=100" --jq '.workflow_runs | sort_by(.id) | last | {status, conclusion}')"
            status="$(jq -r '.status // ""' <<< "$run")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$run")"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                exit 0
              fi
              echo "ci on commit $COMMIT concluded $conclusion; publishing is blocked" >&2
              exit 1
            fi
            sleep 30
          done
          echo "timed out waiting for ci on commit $COMMIT" >&2
          exit 1

  # Builds the source archive and the SBOM with read-only permissions and no OIDC token: nothing that
  # runs here can mint an attestation.
  build:
    name: build the source archive
    needs: require-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.pack.outputs.archive }}
      sha256: ${{ steps.pack.outputs.sha256 }}
      sbom_sha256: ${{ steps.pack.outputs.sbom_sha256 }}
      sums_sha256: ${{ steps.pack.outputs.sums_sha256 }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            proxy.golang.org:443
            sum.golang.org:443
            storage.googleapis.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check the tag against the release manifest and main
        env:
          TAG: ${{ github.event.release.tag_name }}
          COMMIT: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" != "$COMMIT" ]; then
            echo "the release tag no longer points to the commit verified by CI" >&2
            exit 1
          fi
          version="$(jq -r '."."' .release-please-manifest.json)"
          if [ "$TAG" != "v$version" ]; then
            echo "release tag $TAG does not match the manifest version v$version" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "the commit tagged $TAG is not on main" >&2
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Write the source archive, the SBOM and the archive's digest
        id: pack
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          archive="hushscript-go-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="hushscript-go-${TAG}/" --output="$archive" HEAD
          scripts/sbom.sh "$TAG" > sbom.cdx.json
          sha256sum "$archive" sbom.cdx.json > SHA256SUMS
          {
            echo "archive=$archive"
            echo "sha256=$(sha256sum "$archive" | cut -d' ' -f1)"
            echo "sbom_sha256=$(sha256sum sbom.cdx.json | cut -d' ' -f1)"
            echo "sums_sha256=$(sha256sum SHA256SUMS | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"
      - name: Keep the archive, the SBOM and the digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: |
            ${{ steps.pack.outputs.archive }}
            sbom.cdx.json
            SHA256SUMS
          retention-days: 90
          if-no-files-found: error

  # The only job with an OIDC token. It runs no project code: it checks the archive, the SBOM and the
  # digest file against the digests the build job computed, attests the archive and the SBOM, and
  # attaches everything to the GitHub release.
  attest:
    name: attest and attach to the release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # attach the assets to the release
      id-token: write # keyless signing of the build attestation
      attestations: write # attest-build-provenance
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Download the build's files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
      - name: Verify the files against the build job's digests
        env:
          ARCHIVE: ${{ needs.build.outputs.archive }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.sha256 }}
          EXPECTED_SBOM_SHA256: ${{ needs.build.outputs.sbom_sha256 }}
          EXPECTED_SUMS_SHA256: ${{ needs.build.outputs.sums_sha256 }}
        run: |
          verify() {
            actual="$(sha256sum "$1" | cut -d' ' -f1)"
            if [ -z "$2" ] || [ "$actual" != "$2" ]; then
              echo "the digest of $1 is $actual, not the build job's $2" >&2
              exit 1
            fi
          }
          verify "$ARCHIVE" "$EXPECTED_ARCHIVE_SHA256"
          verify sbom.cdx.json "$EXPECTED_SBOM_SHA256"
          verify SHA256SUMS "$EXPECTED_SUMS_SHA256"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ needs.build.outputs.archive }}
            sbom.cdx.json
      - name: Attach the archive, the SBOM and the digests to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: gh release upload "$TAG" "$ARCHIVE" sbom.cdx.json SHA256SUMS --clobber
