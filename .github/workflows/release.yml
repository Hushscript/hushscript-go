name: release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {} # every write goes through the App token below
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
      - name: Create the App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # No fallback: a missing secret fails here. A release created with the default token would
          # not start the workflows that listen for releases, so the App token is required.
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write # tag and create the release
          permission-pull-requests: write # open and update the release PR
          permission-issues: write # release-please manages its autorelease labels
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: go
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A Go module is "published" by its tag. The first fetch through the proxy caches the version, and
  # makes it appear on pkg.go.dev, so this step asks for it once the tag exists.
  warm-proxy:
    name: warm proxy.golang.org
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            proxy.golang.org:443
      - name: Fetch the new version through the module proxy
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          # The proxy encodes capital letters in module paths as "!" and the lower-case letter.
          url="https://proxy.golang.org/github.com/!hushscript/hushscript-go/@v/${TAG}.info"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 60 "$url"; then
              echo
              exit 0
            fi
            echo "attempt $attempt: the proxy does not know $TAG yet" >&2
            sleep 20
          done
          echo "proxy.golang.org still does not serve $TAG" >&2
          exit 1
