name: nightly

on:
  schedule:
    - cron: "37 2 * * *"

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  mutation:
    name: mutation (${{ matrix.file }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {file: http.go, job_minutes: 60, mutation_seconds: 3300}
          - {file: retry.go, job_minutes: 60, mutation_seconds: 3300}
          - {file: pacing.go, job_minutes: 60, mutation_seconds: 3300}
          - {file: transcribe.go, job_minutes: 110, mutation_seconds: 6000}
          - {file: upload.go, job_minutes: 120, mutation_seconds: 6600}
          - {file: resume.go, job_minutes: 60, mutation_seconds: 3300}
          - {file: wait.go, job_minutes: 60, mutation_seconds: 3300}
          - {file: heartbeat.go, job_minutes: 60, mutation_seconds: 3300}
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            sum.golang.org:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Run mutation tests
        env:
          MUTATION_FILE: ${{ matrix.file }}
          MUTATION_TIMEOUT: ${{ matrix.mutation_seconds }}
        run: just mutation-shard "$MUTATION_FILE" counts 1.26
      - name: Upload the shard counts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-counts-${{ matrix.file }}
          path: counts/${{ matrix.file }}.counts
          if-no-files-found: error
          retention-days: 7

  mutation-total:
    name: mutation (total)
    needs: mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Download the shard counts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-counts-*
          merge-multiple: true
          path: counts
      - name: Enforce the floor on the total
        run: just mutation-sum counts

  fuzz:
    name: fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            sum.golang.org:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Run the fuzz targets
        run: just fuzz

  smoke:
    name: smoke (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: smoke
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            sum.golang.org:443
            api.hushscript.com:443
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Run the production smoke test
        env:
          SMOKE_TOKEN: ${{ secrets.SMOKE_TOKEN }}
        run: just smoke
